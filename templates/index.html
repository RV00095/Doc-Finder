<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Doctor Finder LK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Tahoma,sans-serif;background:#f0f2f5;color:#222;padding:14px}
.wrap{max-width:1000px;margin:0 auto}
header{background:linear-gradient(135deg,#283593,#1976d2);color:#fff;padding:22px;border-radius:12px;text-align:center;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:12px;border:0;border-radius:8px;font-weight:700;background:#d7dee8;cursor:pointer}
.tab.on{background:#1976d2;color:#fff}
.panel{display:none}.panel.on{display:block}
.box{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select{flex:1;min-width:210px;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:15px}
button{padding:12px 14px;border:0;border-radius:8px;background:#1976d2;color:#fff;font-weight:700;cursor:pointer}
.btn-green{background:#2e7d32}
.status{display:none;background:#e3f2fd;color:#0d47a1;padding:10px;border-radius:8px;margin-bottom:10px;font-weight:600}
.card{background:#fff;border-left:5px solid #1976d2;border-radius:10px;padding:14px;margin-bottom:12px}
.name{font-size:18px;font-weight:800;color:#b71c1c}
.hosp{display:inline-block;margin:8px 0;background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;padding:5px 10px;border-radius:6px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
.bk{background:#c8e6c9;color:#1b5e20;padding:2px 8px;border-radius:10px;font-weight:700}
.lb{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.big{font-size:22px;font-weight:800;color:#2e7d32}
small{color:#666}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏥 Doctor Finder LK</h1>
    <p>Live sessions • Active bookings • Specialty leaderboard</p>
  </header>

  <div class="tabs">
    <button class="tab on" onclick="go('search')">🔍 Search by Name</button>
    <button class="tab" onclick="go('top')">🏆 Top Doctors</button>
  </div>

  <div id="search" class="panel on">
    <div class="box">
      <div class="row">
        <input id="q" placeholder="Doctor name" onkeypress="if(event.key==='Enter')doSearch()" />
        <button onclick="doSearch()">Search</button>
        <button class="btn-green" id="csvBtn" style="display:none" onclick="downloadCSV()">📥 Download CSV</button>
      </div>
      <label style="display:block;margin-top:10px;font-size:14px">
        <input type="checkbox" id="onlyBooked" onchange="paint()" /> Only Active Appointments &gt; 0
      </label>
    </div>
    <div id="sStatus" class="status"></div>
    <div id="sResults"></div>
  </div>

  <div id="top" class="panel">
    <div class="box">
      <div class="row">
        <select id="spec"><option value="">Loading specialties...</option></select>
        <button onclick="doTop()">Get Leaderboard</button>
      </div>
      <small>Uses live doc.lk data. Takes ~10–20s.</small>
    </div>
    <div id="tStatus" class="status"></div>
    <div id="tResults" class="box" style="display:none"></div>
  </div>
</div>

<script>
let allResults=[];

function go(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  event.target.classList.add('on');
  if(id==='top') loadSpecs();
}
function show(id,msg){const el=document.getElementById(id);el.style.display='block';el.textContent=msg;}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));}

async function doSearch(){
  const q=document.getElementById('q').value.trim();
  if(q.length<2) return alert('Name too short');
  allResults=[]; document.getElementById('sResults').innerHTML='';
  document.getElementById('csvBtn').style.display='none';
  show('sStatus','Searching...');
  try{
    const res=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({doctor:q})});
    const data=await res.json();
    if(data.error) return show('sStatus','Error: '+data.error);
    if(!data.items?.length) return show('sStatus','No doctors found');
    allResults=data.items.map(it=>({...it,loaded:false,sessions:[]}));
    paint();
    show('sStatus',`Found ${allResults.length}. Loading sessions...`);
    let done=0;
    for(let i=0;i<allResults.length;i+=3){
      const batch=allResults.slice(i,i+3);
      await Promise.all(batch.map(async it=>{
        try{
          const r=await fetch('/api/channel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:it.channel_url,doctor:it.doctor,hospital:it.hospital,specialty:it.specialty})});
          const d=await r.json();
          it.doctor=d.doctor||it.doctor;
          it.hospital=d.hospital||it.hospital;
          it.specialty=d.specialty||it.specialty;
          it.sessions=d.sessions||[];
        }catch(e){it.sessions=[];}
        it.loaded=true; done++; show('sStatus',`Loaded ${done}/${allResults.length}`); paint();
      }));
    }
    show('sStatus',`✅ Done (${allResults.length})`);
    document.getElementById('csvBtn').style.display='inline-block';
  }catch(e){show('sStatus','Error: '+e.message)}
}

function paint(){
  const only=document.getElementById('onlyBooked').checked;
  let html='';
  for(const it of allResults){
    let ss=it.sessions||[];
    if(only) ss=ss.filter(s=>Number(s.booked)>0);
    if(only && it.loaded && !ss.length) continue;
    html+=`<div class="card">
      <div class="name">👨‍⚕️ ${esc(it.doctor)}</div>
      <div class="hosp">🏥 ${esc(it.hospital||'Unknown Hospital')}</div>
      <div><small>🩺 ${esc(it.specialty||'')}</small></div>`;
    if(!it.loaded) html+=`<div><small>⏳ Loading sessions...</small></div>`;
    else if(!ss.length) html+=`<div><small>No sessions${only?' with bookings':''}</small></div>`;
    else{
      html+=`<table><thead><tr><th>Hospital</th><th>Date</th><th>Time</th><th>Booked</th><th>Status</th></tr></thead><tbody>`;
      for(const s of ss){
        html+=`<tr>
          <td><b>🏥 ${esc(s.hospital||it.hospital)}</b></td>
          <td>📅 ${esc(s.date)} (${esc(s.day||'')})</td>
          <td>⏰ ${esc(s.time)}</td>
          <td><span class="${Number(s.booked)>0?'bk':''}">${esc(s.booked)}</span></td>
          <td>${esc(s.status)}</td>
        </tr>`;
      }
      html+=`</tbody></table>`;
    }
    html+=`<div style="margin-top:8px"><a href="${esc(it.channel_url)}" target="_blank">Open Doc990 ↗</a></div></div>`;
  }
  document.getElementById('sResults').innerHTML=html||'<div class="box">No results</div>';
}

function downloadCSV(){
  const only=document.getElementById('onlyBooked').checked;
  const rows=[['Doctor','Specialty','Hospital','Date','Day','Time','Booked','Status','URL']];
  allResults.forEach(it=>{
    (it.sessions||[]).forEach(s=>{
      if(only && Number(s.booked)<=0) return;
      rows.push([it.doctor,it.specialty,it.hospital||s.hospital,s.date,s.day,s.time,s.booked,s.status,it.channel_url]);
    });
  });
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='doctor_sessions.csv'; a.click();
}

async function loadSpecs(){
  const sel=document.getElementById('spec');
  if(sel.dataset.ok==='1') return;
  try{
    const res=await fetch('/api/get_specialties');
    const specs=await res.json();
    sel.innerHTML=(specs||[]).map(s=>`<option value="${esc(s.id)}" data-name="${esc(s.name)}">${esc(s.name)}</option>`).join('');
    sel.dataset.ok='1';
  }catch(e){
    sel.innerHTML='<option value="General Physician" data-name="General Physician">General Physician</option>';
  }
}

async function doTop(){
  const sel=document.getElementById('spec');
  const id=sel.value;
  const name=sel.options[sel.selectedIndex]?.getAttribute('data-name') || sel.options[sel.selectedIndex]?.text || '';
  if(!id && !name) return alert('Select specialty');
  document.getElementById('tResults').style.display='none';
  show('tStatus',`Fetching ${name} leaderboard...`);
  try{
    const res=await fetch('/api/top_doctors',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({specialty_id:id, specialty_name:name})
    });
    const data=await res.json();
    if(data.error) return show('tStatus','Error: '+data.error);
    const docs=data.doctors||[];
    if(!docs.length){
      show('tStatus',`No ranked doctors. Links found: ${data.found_links||0}, checked: ${data.checked||0}. ${data.message||''}`);
      return;
    }
    let html=`<h3 style="margin-bottom:8px">🏆 ${esc(name)}</h3>
      <small>Found links: ${data.found_links||0} | Checked: ${data.checked||0}</small>`;
    docs.forEach((d,i)=>{
      const rank=i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`;
      html+=`<div class="lb">
        <div>
          <div style="font-weight:800">${rank} ${esc(d.name)}</div>
          <small>🏥 ${(d.hospitals||[]).map(esc).join(', ')||'N/A'}</small><br/>
          <small>🩺 ${esc(d.specialty||'')} • Sessions: ${d.session_count||0}</small>
        </div>
        <div style="text-align:right">
          <div class="big">${d.total_booked||0}</div>
          <small>Active bookings</small>
        </div>
      </div>`;
    });
    const box=document.getElementById('tResults');
    box.innerHTML=html; box.style.display='block';
    show('tStatus',`✅ Top ${docs.length} doctors loaded`);
  }catch(e){show('tStatus','Error: '+e.message)}
}
</script>
</body>
</html>
